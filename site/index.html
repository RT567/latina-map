<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latino Sydney — El Mapa</title>
<meta name="description" content="Salsa, arepas y fútbol: a bilingual field guide to Latin Sydney. Real venues, real census data, questionable jokes.">
<meta property="og:title" content="Latino Sydney — El Mapa">
<meta property="og:description" content="Salsa, arepas y fútbol: a field guide to Latin Sydney 🌎💃🌮">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💃</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #14100e;
    --panel: #1f1815;
    --ink: #f5ede4;
    --muted: #b8a89a;
    --accent: #ff5d3a;
    --accent2: #ffc53d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(90deg, #2a1510, #1f1815);
    border-bottom: 2px solid var(--accent);
  }
  header h1 { margin: 0; font-size: 1.25rem; letter-spacing: .02em; }
  header h1 span { color: var(--accent2); }
  header .tagline { margin: 0; color: var(--muted); font-size: .85rem; flex: 1; }
  .hbtn {
    background: none; border: 1px solid var(--accent); color: var(--ink);
    border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: .85rem;
  }
  .hbtn:hover { background: var(--accent); }
  #main { flex: 1; display: flex; min-height: 0; position: relative; }
  #map { flex: 1; background: #222; }
  aside {
    width: 270px; background: var(--panel); padding: 14px; overflow-y: auto;
    border-left: 1px solid #332822; font-size: .9rem;
  }
  aside h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); margin: 16px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .layer-toggle { display: flex; align-items: center; gap: 8px; padding: 5px 4px;
    cursor: pointer; border-radius: 6px; user-select: none; }
  .layer-toggle:hover { background: #2a211c; }
  .layer-toggle input { accent-color: var(--accent); }
  .count { margin-left: auto; color: var(--muted); font-size: .78rem; }
  .event { padding: 7px 8px; border-radius: 8px; background: #2a211c; margin-bottom: 6px; }
  .event b { display: block; font-size: .88rem; }
  .event small { color: var(--muted); }
  .event .day { color: var(--accent2); font-weight: 600; }
  #phrase { padding: 10px; border: 1px dashed var(--accent); border-radius: 8px;
    cursor: pointer; user-select: none; }
  #phrase .es { font-weight: 700; color: var(--accent2); }
  #phrase .en { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  #phrase .hint { color: #7a6c60; font-size: .7rem; margin-top: 6px; }
  .note { margin-top: 14px; padding: 10px; background: #2a211c; border-radius: 8px;
    color: var(--muted); font-size: .78rem; line-height: 1.45; }
  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--ink);
    border-radius: 10px; }
  .leaflet-popup-tip { background: var(--panel); }
  .popup-cat { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em;
    color: var(--accent2); }
  .popup-name { font-weight: 700; font-size: 1rem; margin: 2px 0; }
  .popup-blurb { color: var(--muted); font-size: .85rem; }
  .char-pin { filter: drop-shadow(0 2px 3px rgba(0,0,0,.7)); transform-origin: 50% 90%; }
  .char-pin.groove { animation: groove 1.1s ease-in-out infinite; }
  .char-pin.groove2 { animation: groove 0.9s ease-in-out infinite reverse; }
  @keyframes groove {
    0%, 100% { transform: rotate(-7deg); }
    50% { transform: rotate(7deg) translateY(-2px); }
  }
  .emoji-pin { font-size: 22px; line-height: 22px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .emoji-pin.small { font-size: 15px; line-height: 15px; opacity: .9; }
  /* dark-mode the OSM raster tiles (no API key needed, unlike CARTO/Mapbox) */
  .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.85) contrast(1.05); }

  #radio {
    position: absolute; left: 12px; bottom: 24px; z-index: 900;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
    overflow: hidden; width: 300px; box-shadow: 0 4px 18px rgba(0,0,0,.5);
  }
  #radio .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    cursor: pointer; user-select: none; font-size: .85rem; }
  #radio .bar .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
  #radio .bar .eq i { width: 3px; background: var(--accent2); display: inline-block;
    animation: eq 0.8s ease-in-out infinite; }
  #radio .bar .eq i:nth-child(2) { animation-delay: .2s; }
  #radio .bar .eq i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 0%,100% { height: 4px; } 50% { height: 12px; } }
  #radio .body { display: none; }
  #radio.open .body { display: block; }
  #radio .now { padding: 6px 12px 0; font-size: .8rem; opacity: .9; }
  #radio .ctl { display: flex; gap: 6px; padding: 6px 12px 10px; }
  #radio .ctl button { flex: 1; font-size: 1.1rem; padding: 4px 0; cursor: pointer;
    background: transparent; color: inherit; border: 1px solid var(--accent); border-radius: 8px; }
  #radio:not(.playing) .bar .eq i { animation-play-state: paused; height: 4px; }
  #toast {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 8px 18px; border-radius: 999px;
    font-weight: 600; z-index: 950; opacity: 0; transition: opacity .3s;
    pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.4); font-size: .9rem;
  }
  #toast.show { opacity: 1; }
  @media (max-width: 640px) {
    #main { flex-direction: column; }
    aside { width: 100%; max-height: 42%; border-left: none; border-top: 1px solid #332822; }
    #radio { width: 250px; bottom: 12px; }
  }
</style>

  <header>
    <h1>🌎 Latino Sydney — <span>El Mapa</span></h1>

    <button id="radar" class="hbtn"></button>
    <button id="lang-toggle" class="hbtn"></button>
  </header>

    <div id="map"></div>

      <div class="note" data-i18n="note"></div>

    <div id="radio">

        <b data-i18n="radio"></b>

const DENSITY_CAST = ["dancer", "maracas", "trumpet", "futbol", "vendor", "abuela"];
const CAT_CHAR = { dance: "dancer", food: "chef", grocery: "abuela", futbol: "futbolista",
  event: "trumpetista", culture: "sonera", beach: "surfista", transport: null, density: "maracas" };
const CAT_EMOJI = { dance: "💃", food: "🌮", grocery: "🛒", futbol: "⚽",
  event: "🎉", culture: "🎭", beach: "🏖️", transport: "🚆", density: "🕺",
  census: "🌶️" };

// Dance-floor phrasebook — cheeky, not creepy.
const PHRASES = [
  { es: "¿Bailamos?", en: "Shall we dance?" },
  { es: "¿Dónde está la fiesta este finde?", en: "Where's the party this weekend?" },
  { es: "Tranqui, es mi primera clase de salsa.", en: "Relax, it's my first salsa class." },
  { es: "Otra ronda de empanadas, por favor.", en: "Another round of empanadas, please." },
  { es: "¡Qué buena onda este lugar!", en: "This place has great vibes!" },
  { es: "Perdón por pisarte, sigo aprendiendo bachata.", en: "Sorry for stepping on you, still learning bachata." },
  { es: "El asado lo hago yo el domingo.", en: "I'm doing the barbecue on Sunday." },
  { es: "Sin música no hay mapa.", en: "No music, no map." },
];

// ---------- DATA ----------
// Venues: hand-curated list (curated.js) + real OSM pulls (data.js).
const PLACES = ((window.CURATED || {}).places || []).concat(window.OSM_PLACES || []);

const BEACHES = [
  { name: "Bondi", lat: -33.8908, lng: 151.2743 },
  { name: "Bronte", lat: -33.9036, lng: 151.2699 },
  { name: "Coogee", lat: -33.9205, lng: 151.2576 },
  { name: "Maroubra", lat: -33.9500, lng: 151.2570 },
  { name: "Manly", lat: -33.7971, lng: 151.2878 },
  { name: "Balmoral", lat: -33.8270, lng: 151.2510 },
  { name: "Cronulla", lat: -34.0587, lng: 151.1526 },
  { name: "Palm Beach", lat: -33.5990, lng: 151.3230 },
];

const STATIONS = [
  { name: "Central", lat: -33.8832, lng: 151.2070 },
  { name: "Town Hall", lat: -33.8735, lng: 151.2065 },
  { name: "Bondi Junction", lat: -33.8915, lng: 151.2480 },
  { name: "Parramatta", lat: -33.8170, lng: 151.0040 },
  { name: "Fairfield", lat: -33.8720, lng: 150.9570 },
  { name: "Liverpool", lat: -33.9245, lng: 150.9250 },
];

const EVENTS = (window.CURATED || {}).events || [];

// Suburb roasts shown on census-crowd popups (defaults apply elsewhere).
const ROASTS = {
  "Fairfield": { en: "the OG heartland — first wave, best empanadas", es: "el corazón original — primera ola, mejores empanadas" },
  "Fairfield West": { en: "the heartland's heartland", es: "el corazón del corazón" },
  "Liverpool": { en: "Sunday futsal never actually ends here", es: "acá el futsal del domingo nunca termina" },
  "Bondi": { en: "technically a suburb of Rio", es: "técnicamente un barrio de Río" },
  "Bondi Beach": { en: "technically a suburb of Rio (beach branch)", es: "técnicamente un barrio de Río (sucursal playa)" },
  "Maroubra": { en: "the Brazilian surfers' embassy", es: "la embajada de los surfistas brasileños" },
  "Dee Why": { en: "Rio's northern beaches consulate", es: "el consulado playero de Río en el norte" },
  "Marrickville": { en: "Little Portugal with a reggaeton remix", es: "la Pequeña Portugal con remix de reggaetón" },
  "Petersham": { en: "Little Portugal, the original pressing", es: "la Pequeña Portugal, edición original" },
  "Mascot": { en: "closest empanadas to the airport", es: "las empanadas más cerca del aeropuerto" },
  "Coogee": { en: "backpacker cumbia zone", es: "zona de cumbia mochilera" },
  "Randwick": { en: "study visa, salsa shoes", es: "visa de estudiante, zapatos de salsa" },
  "Wolli Creek": { en: "vertical Latin America", es: "Latinoamérica en vertical" },
  "Waterloo": { en: "new towers, old cumbias", es: "torres nuevas, cumbias viejas" },
};
const ROAST_DEFAULT = { en: "confirmed fiesta activity (per the census)", es: "actividad de fiesta confirmada (según el censo)" };
// ----------------------------------------------------------------------

const map = L.map("map").setView([-33.87, 151.05], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

function charIcon(name, size, groove) {
  const cls = groove ? (Math.random() < .5 ? "groove" : "groove2") : "";
  const html = svgWrap(CHARS[name], size).replace('class="char-pin"', `class="char-pin ${cls}"`);
  return L.divIcon({ className: "", html, iconSize: [size, size * 1.4],
    iconAnchor: [size / 2, size * 1.3] });
}
function emojiIcon(emoji, small) {
  return L.divIcon({ className: "",
    html: `<div class="emoji-pin${small ? " small" : ""}">${emoji}</div>`,
    iconSize: small ? [15, 15] : [22, 22], iconAnchor: small ? [8, 8] : [11, 11] });
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const groups = {};
for (const key of Object.keys(CAT_EMOJI)) groups[key] = L.layerGroup().addTo(map);
const markers = [];
const foodMarkers = [];

function addMarker(cat, lat, lng, icon, build) {
  const m = L.marker([lat, lng], { icon }).addTo(groups[cat]);
  markers.push({ marker: m, build });
  return m;
}

for (const p of PLACES) {
  const icon = CAT_CHAR[p.cat] ? charIcon(CAT_CHAR[p.cat], 34) : emojiIcon(CAT_EMOJI[p.cat]);
  const m = addMarker(p.cat, p.lat, p.lng, icon, l =>
    `<div class="popup-cat">${CAT_EMOJI[p.cat]} ${I18N[l].cats[p.cat]} · ${p.suburb}</div>
     <div class="popup-name">${p.name}</div>
     <div class="popup-blurb">${p.blurb[l]}</div>`);
  if (p.cat === "food" || p.cat === "grocery") foodMarkers.push(m);
}
for (const b of BEACHES) {
  L.circle([b.lat, b.lng], { radius: 420, color: "#ffc53d", weight: 1.5,
    fillColor: "#ffc53d", fillOpacity: 0.18 }).addTo(groups.beach);
  addMarker("beach", b.lat, b.lng, charIcon("surfista", 30), l =>
    `<div class="popup-cat">🏖️ ${I18N[l].cats.beach}</div>
     <div class="popup-name">${b.name}</div>`);
}
for (const s of STATIONS) {
  addMarker("transport", s.lat, s.lng, emojiIcon("🚆", true), l =>
    `<div class="popup-cat">🚆 ${I18N[l].cats.transport}</div>
     <div class="popup-name">${s.name}</div>`);
}
(window.CENSUS_SCATTER || []).forEach((d, i) => {
  const rand = mulberry32(i * 1337 + 7);
  const roast = ROASTS[d.suburb] || ROAST_DEFAULT;
  const stats = l => l === "es"
    ? `${d.es} hablantes de español · ${d.pt} de portugués (Censo 2021)`
    : `${d.es} Spanish + ${d.pt} Portuguese speakers (2021 census)`;
  for (let k = 0; k < d.n; k++) {
    const ang = rand() * Math.PI * 2;
    const dist = Math.sqrt(rand()) * 0.009;
    const who = DENSITY_CAST[Math.floor(rand() * DENSITY_CAST.length)];
    addMarker("density", d.lat + Math.sin(ang) * dist, d.lng + Math.cos(ang) * dist * 1.2,
      charIcon(who, 24, true), l =>
      `<div class="popup-cat">🕺 ${I18N[l].cats.density}</div>
       <div class="popup-name">${d.suburb}</div>
       <div class="popup-blurb">${roast[l]}<br><small>${stats(l)}</small></div>`);
  }
});

// census choropleth: Spanish+Portuguese speakers per suburb (ABS 2021, G13 SAL)
fetch("census.json").then(r => r.json()).then(gj => {
  const color = t => t > 800 ? "#b30021" : t > 400 ? "#e0263c" : t > 200 ? "#ff5d3a"
    : t > 100 ? "#ff9d3a" : "#ffc53d";
  L.geoJSON(gj, {
    style: f => {
      const t = f.properties.spanish + f.properties.portuguese;
      return { color: "#ffc53d", weight: .4, opacity: .2,
        fillColor: color(t), fillOpacity: Math.min(.28, .04 + t / 3500) };
    },
    onEachFeature: (f, layer) => {
      const p = f.properties;
      markers.push({ marker: layer, build: l => l === "es"
        ? `<div class="popup-cat">🌶️ Censo 2021</div><div class="popup-name">${p.name}</div>
           <div class="popup-blurb">${p.spanish} hablantes de español · ${p.portuguese} de portugués<br>
           nacidos en Brasil: ${p.brazil} · en Chile: ${p.chile}</div>`
        : `<div class="popup-cat">🌶️ Census 2021</div><div class="popup-name">${p.name}</div>
           <div class="popup-blurb">${p.spanish} Spanish + ${p.portuguese} Portuguese speakers<br>
           born in Brazil: ${p.brazil} · in Chile: ${p.chile}</div>` });
    },
  }).addTo(groups.census);
  window.__censusCount = gj.features.length;
  render();
}).catch(() => {});

// ---------- UI ----------
let phraseIdx = 0;
function render() {
  const t = I18N[lang];
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-i18n]"))
    el.textContent = t[el.dataset.i18n];
  document.getElementById("lang-toggle").textContent = t.toggle;
  document.getElementById("radar").textContent = t.radar;

  const ph = PHRASES[phraseIdx % PHRASES.length];
  document.getElementById("phrase").innerHTML =
    `<div class="es">“${ph.es}”</div><div class="en">${ph.en}</div>
     <div class="hint">${t.phraseHint}</div>`;

  document.getElementById("events").innerHTML = EVENTS.map(e =>
    `<div class="event"><b>${e.name}</b>
     <small><span class="day">${e.day[lang]}</span> · ${e.venue} · ${e.suburb}</small></div>`
  ).join("");

  const layersEl = document.getElementById("layers");
  layersEl.innerHTML = "";
  for (const [key, emoji] of Object.entries(CAT_EMOJI)) {
    const row = document.createElement("label");
    row.className = "layer-toggle";
    row.innerHTML = `<input type="checkbox" ${map.hasLayer(groups[key]) ? "checked" : ""}>
      <span>${emoji} ${t.cats[key]}</span>
      <span class="count">${key === "census" ? (window.__censusCount || "…") : groups[key].getLayers().length}</span>`;
    row.querySelector("input").addEventListener("change", e => {
      e.target.checked ? map.addLayer(groups[key]) : map.removeLayer(groups[key]);
    });
    layersEl.appendChild(row);
  }
  for (const { marker, build } of markers) marker.bindPopup(build(lang));
}
document.getElementById("lang-toggle").addEventListener("click", () => {
  lang = lang === "en" ? "es" : "en"; render();
});
document.getElementById("phrase").addEventListener("click", () => {
  phraseIdx++; render();
});

// empanada radar: fly to a random food spot
document.getElementById("radar").addEventListener("click", () => {
  if (!foodMarkers.length) return;
  const m = foodMarkers[Math.floor(Math.random() * foodMarkers.length)];
  map.flyTo(m.getLatLng(), 15, { duration: 1.6 });
  const toast = document.getElementById("toast");
  toast.textContent = I18N[lang].radarToast;
  toast.classList.add("show");
  setTimeout(() => { m.openPopup(); toast.classList.remove("show"); }, 1800);
});

// radio: free internet-radio streams (no ads, no 30s previews, no skipping) played with a plain
// <radioAudio>. Station list from radio-browser.info, HTTPS streams only, probed 2026-09-02.
// Browsers block radioAudio until the first user gesture, so we try on load and again on first
// pointerdown/keydown. Bar click toggles the panel; ⏭ cycles stations; ⏯ pauses.
const radio = document.getElementById("radio");
const RADIO_STATIONS = [
  { name: "Radio Cumbia 90s (Bolivia)",       url: "https://emiteradio.com/proxy/cumbia90s?mp=/stream" },
  { name: "Rádio MGT Brasil Hits",            url: "https://cast.mgtradio.net/radio/8030/aac" },
  { name: "MGT Brega e Retrô (Brasil)",       url: "https://cast.mgtradio.net/radio/8060/aac" },
  { name: "Top Merengue Radio (Rep. Dom.)",   url: "https://radio.dominiserver.com/proxy/topmerengueradio?mp=/stream" },
  { name: "Colombia Crossover (champeta, cumbia, merengue)", url: "https://radio35.virtualtronics.com/proxy/colombiacrossover?mp=/;" },
  { name: "Jovem Pan FM Floripa (Brasil)",    url: "https://live.paineldj.com.br/proxy/jfloripa?mp=/stream" },
];
let radioIdx = 0;
const radioAudio = document.getElementById("radio-audio");
const radioNowEl = document.getElementById("radio-now");
radioAudio.volume = 0.6;
function radioTune(i) {
  radioIdx = (i + RADIO_STATIONS.length) % RADIO_STATIONS.length;
  radioAudio.src = RADIO_STATIONS[radioIdx].url;
  radioNowEl.textContent = RADIO_STATIONS[radioIdx].name;
  radioTryPlay();
}
function radioTryPlay() { const p = radioAudio.play(); if (p && p.catch) p.catch(() => {}); }
radio.classList.add("open");
document.getElementById("radio-arrow").textContent = "▴";
radio.querySelector(".bar").addEventListener("click", () => {
  radio.classList.toggle("open");
  document.getElementById("radio-arrow").textContent = radio.classList.contains("open") ? "▴" : "▾";
});
document.getElementById("radio-next").addEventListener("click", (e) => { e.stopPropagation(); radioTune(radioIdx + 1); });
document.getElementById("radio-toggle").addEventListener("click", (e) => { e.stopPropagation(); radioAudio.paused ? radioTryPlay() : radioAudio.pause(); });
radioAudio.addEventListener("error", () => radioTune(radioIdx + 1));   // dead stream → next one
radioAudio.addEventListener("play",  () => radio.classList.add("playing"));
radioAudio.addEventListener("pause", () => radio.classList.remove("playing"));
const radioOnce = () => { if (radioAudio.paused) radioTryPlay(); document.removeEventListener("pointerdown", radioOnce); document.removeEventListener("keydown", radioOnce); };
document.addEventListener("pointerdown", radioOnce);
document.addEventListener("keydown", radioOnce);
radioTune(0);

render();
</script>
